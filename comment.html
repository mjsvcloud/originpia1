<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>댓글 페이지</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 30px;
            line-height: 1.6;
        }

        /* 메인 버튼 스타일 */
        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 8px 16px;
            background-color: #21262d;
            border: 1px solid #30363d;
            color: #58a6ff; /* 링크 파란색 */
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
        }
        .back-button:hover { background-color: #30363d; }

        header, main {
            max-width: 800px;
            margin: 0 auto 20px auto;
            padding: 25px;
            background-color: #161b22;
            border-radius: 12px;
            border: 1px solid #30363d;
        }

        h1 { color: #ffffff; margin-top: 0; }
        hr { border: 0; border-top: 1px solid #30363d; margin: 40px 0; }

        #comments {
            max-width: 800px;
            margin: 0 auto;
            background-color: #161b22;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #30363d;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <div style="max-width: 800px; margin: 0 auto;">
        <a href="index.html" class="back-button">← 메인으로 돌아가기</a>
    </div>

    <header>
        <h1>문의 글을 남겨주세요</h1>
    </header>

    <main>
        <p>운영자가 수시로 확인합니다. 자유롭게 의견을 남겨주세요.</p>
    </main>

    <hr>

    <section id="comments">
        <script src="https://giscus.app/client.js"
                data-repo="mjsvcloud/originpia1"
                data-repo-id="R_kgDOTIgxnQ"
                data-category="General"
                data-category-id="DIC_kwDOTIgxnc4DAb_9"
                data-mapping="pathname"
                data-strict="0"
                data-reactions-enabled="1"
                data-emit-metadata="0"
                data-input-position="bottom"
                data-theme="dark_tritanopia"
                data-lang="ko"
                data-loading="lazy"
                crossorigin="anonymous"
                async>

</html>
