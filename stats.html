<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<title>스텟 설명 - 오리진피아</title>
	<style>
		body { font-family: sans-serif; line-height: 1.6; max-width: 800px; margin: 40px auto; padding: 20px; color: #333; }
		h1 { border-bottom: 2px solid #2c3e50; padding-bottom: 10px; }
		table { width: 100%; border-collapse: collapse; margin-top: 20px; }
		th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
		th { background-color: #f8f9fa; }
		
		/* 색상 클래스 */
		.red { color: #e74c3c; }    /* 투지 - 붉은색 */
		.orange { color: #e67e22; } /* 활력 - 주황색 */
		.blue { color: #3498db; }   /* 신념 - 파란색 */
		.yellow { color: #d4ac0d; } /* 예리 - 노란색 */
		
		.back-link { display: inline-block; margin-top: 20px; color: #666; text-decoration: none; }
	</style>
</head>
<body>

	<h1>오리진피아 스텟 상세 정보</h1>

	<table>
		<thead>
			<tr>
				<th>스텟 명</th>
				<th>효과</th>
			</tr>
		</thead>
		<tbody>
			<tr>
				<td class="red">투지</td>
				<td>1당 공격력 2 증가</td>
			</tr>
			<tr>
				<td class="orange">활력</td>
				<td>1당 체력 10 증가</td>
			</tr>
			<tr>
				<td class="blue">신념</td>
				<td>
					피해감소율 증가<br>
					<small style="color: #7f8c8d;"> 피해감소율 = (신념스텟량) / (신념스텟량 + 레벨 + 500) %</small>
				</td>
			</tr>
			<tr>
				<td class="yellow">예리</td>
				<td>1당 치명타 확률 0.1% 증가</td>
			</tr>
		</tbody>
	</table>

	<a href="index.html" class="back-link">← 메인 페이지로 돌아가기</a>

</body>
</html>
