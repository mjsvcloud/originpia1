<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>생활 콘텐츠 상세 정보 - 오리진피아</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; max-width: 1000px; margin: 40px auto; padding: 20px; color: #333; }
        h1 { color: #2c3e50; border-bottom: 2px solid #2c3e50; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 15px; text-align: left; }
        th { background-color: #f8f9fa; font-weight: bold; white-space: nowrap; }
        .content-name { font-weight: bold; width: 100px; }
        .back-link { display: inline-block; margin-top: 20px; color: #666; text-decoration: none; }
    </style>
</head>
<body>

    <h1>생활 콘텐츠 (Life Skills)</h1>
    <p>오리진피아의 생활 콘텐츠(낚시, 채집, 채광) 상세 가이드입니다.</p>

    <table>
        <thead>
            <tr>
                <th>분류</th>
                <th>상세 설명</th>
                <th>핵심 시스템</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="content-name">낚시</td>
                <td>물에 낚싯대를 우클릭하여 던진 후 미니게임을 통해 포획</td>
                <td>100종의 물고기, 낚싯대 등급에 따라 어종 변화</td>
            </tr>
            <tr>
                <td class="content-name">채집</td>
                <td>나무 원목, 나뭇잎, 꽃, 잔디 등 파괴 시 일정 확률로 획득</td>
                <td>32종의 약초, 채집 도구 등급에 따라 확률 및 종류 변화</td>
            </tr>
            <tr>
                <td class="content-name">채광</td>
                <td>모든 종류의 마인크래프트 광물 파괴 시 일정 확률로 획득</td>
                <td>13종의 특수 광석 존재</td>
            </tr>
        </tbody>
    </table>
