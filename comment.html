<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>댓글 페이지</title>
    <style>
        /* 사이트 전체에 다크 모드 스타일 적용 */
        body {
            background-color: #1a1d21; /* 깃허브 다크 모드와 유사한 어두운 회색 */
            color: #c9d1d9; /* 밝은 회색 텍스트 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px; /* 여백 추가 */
            line-height: 1.6;
        }

        header, main {
            max-width: 800px;
            margin: 0 auto; /* 가운데 정렬 */
            padding: 20px;
            background-color: #22272e; /* 컨텐츠 영역 배경색 (조금 더 밝게) */
            border-radius: 8px;
            margin-bottom: 20px;
        }

        h1 {
            color: #ffffff;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
        }

        hr {
            border: 0;
            border-top: 1px solid #30363d;
            margin: 30px 0;
        }

        /* Giscus 컨테이너 스타일 (선택 사항: 약간의 여백) */
        #comments {
            max-width: 800px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>문의 글을 남겨주세요</h1>
    </header>

    <main>
        <p>운영자가 수시로 확인합니다. 자유롭게 의견을 남겨주세요.</p>
    </main>

    <hr>

    <!-- Giscus 댓글창이 들어갈 영역 -->
    <section id="comments">
        <script src="https://giscus.app/client.js"
                data-repo="mjsvcloud/originpia1"
                data-repo-id="R_kgDOTIgxnQ"
                data-category="General"
                data-category-id="DIC_kwDOTIgxnc4DAb_9"
                data-mapping="pathname"
                data-strict="0"
                data-reactions-enabled="1"
                data-emit-metadata="0"
                data-input-position="bottom"
                /* Giscus 테마 설정: 사이트 배경에 맞춰 어두운 테마로 고정 */
                data-theme="dark_dimmed" 
                data-lang="ko"
                data-loading="lazy"
                crossorigin="anonymous"
                async>
        </script>
    </section>

</body>
</html>
